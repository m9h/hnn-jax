# HNN oracle study spec — Maestro/Merlin-compatible declarative parameter study.
# Defines the (theta -> auditory-ERP dipole) reference set generated by canonical hnn_core (NEURON),
# used as the golden test oracle for the differentiable hnn-jax reimplementation.
# Runs as an in-allocation ensemble on NSG (mini-Flux via joblib); also loadable by real Merlin/Flux
# on DGX/Legion. Keep this the single source of truth for parameter ranges + provenance.

description:
  name: hnn_erp_oracle
  purpose: >
    Reference (theta -> dipole) pairs and finite-difference Jacobians from canonical hnn_core to
    validate hnn-jax forward output and autodiff gradients across the parameter space.

env:
  hnn_core: ">=0.6.0"      # verified per-shard in the provenance manifest
  tstop_ms: 170.0
  dt_ms: 0.025
  n_trials: 1              # deterministic per-sim via fixed event_seed
  base_model: jones_2009_model

# theta — the JoVE 70618 parameters of interest expressed as scalings on the canonical ERP drives.
# (First shard exercises the clean add_evoked_drive params; cell-level Km/GABA_B added once green.)
params:
  tc_sync:    {desc: "thalamocortical synchrony = evprox1 timing sigma (ms)", low: 1.0,  high: 40.0, scale: linear}
  prox1_gain: {desc: "evprox1 (feedforward) AMPA weight scale",               low: 0.25, high: 4.0,  scale: log}
  dist_gain:  {desc: "evdist1 (feedback) AMPA+NMDA weight scale",             low: 0.25, high: 4.0,  scale: log}
  prox2_gain: {desc: "evprox2 (re-emergent feedforward) AMPA weight scale",   low: 0.25, high: 4.0,  scale: log}

sampling:
  method: sobol
  seed: 0

grads:                     # finite-difference Jacobian oracle (gradient ground-truth for autodiff)
  enabled_fraction: 0.05   # only a stratified subset gets FD Jacobians (N_params x cost)
  epsilon: 0.02            # relative perturbation

outputs:
  dipole: aggregate current dipole (nAm) vs time
  provenance: [hnn_core_version, neuron_version, param_spec_hash, sobol_seed, per_sim_event_seed]
